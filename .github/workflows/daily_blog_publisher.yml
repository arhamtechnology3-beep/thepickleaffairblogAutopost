name: The Pickle Affair Daily Blog Publisher

# Runs on GitHub servers — Mac can be offline.
# Stops only when you disable this workflow in GitHub Actions (or delete the schedule).

on:
  schedule:
    # Once per day ~09:05 IST (03:35 UTC). Publishes up to 5 quality posts (fewer OK).
    - cron: '35 3 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'generate | publish | both'
        required: true
        default: 'both'
      count:
        description: 'Max posts this run (1-5)'
        required: false
        default: '5'

concurrency:
  group: pickle-affair-daily-blogs
  cancel-in-progress: false

jobs:
  daily-blogs:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate & publish Kitchen Tales posts
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'generate' || github.event.inputs.mode == 'both' }}
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOP_URL: https://the-pickle-affair.myshopify.com
          SHOPIFY_BLOG_ID: '96853164183'
          DAILY_BLOG_COUNT: ${{ github.event.inputs.count || '5' }}
          PUBLISH_IMMEDIATELY: '1'
        run: |
          echo "Policy: BLOG.md (quality over volume; max ${DAILY_BLOG_COUNT}/day)"
          python3 scratch/generate_daily_blogs.py

      - name: Publish queued drafts (safety net)
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'publish' || github.event.inputs.mode == 'both' }}
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOP_URL: https://the-pickle-affair.myshopify.com
          SHOPIFY_BLOG_ID: '96853164183'
          DAILY_BLOG_COUNT: ${{ github.event.inputs.count || '5' }}
        run: python3 scratch/daily_publish_daemon.py
