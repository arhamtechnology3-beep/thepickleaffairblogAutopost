name: The Pickle Affair Daily Blog Publisher

# Runs on GitHub (Mac offline OK). Each day picks a RANDOM IST publish time.
# Hourly checks; posts only when that day's random slot is due — never a same-time batch.

on:
  schedule:
    # Poll every 30m during ~09:00–20:30 IST (03:30–15:00 UTC)
    - cron: '0,30 3-14 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'generate | publish | both'
        required: true
        default: 'both'
      count:
        description: 'Max posts/day (each at a different random time; default 3)'
        required: false
        default: '3'
      force:
        description: 'Ignore random slot wait (1 = publish now)'
        required: false
        default: '0'

concurrency:
  group: pickle-affair-daily-blogs
  cancel-in-progress: false

jobs:
  daily-blogs:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Publish when today's random slot is due
        if: ${{ github.event_name == 'schedule' || github.event.inputs.mode == 'generate' || github.event.inputs.mode == 'both' }}
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOP_URL: https://the-pickle-affair.myshopify.com
          SHOPIFY_BLOG_ID: '96853164183'
          DAILY_BLOG_COUNT: ${{ github.event_name == 'schedule' && '3' || github.event.inputs.count || '3' }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force || '0' }}
          PUBLISH_IMMEDIATELY: '1'
        run: |
          echo "Random daily slot gate · count=${DAILY_BLOG_COUNT} · force=${FORCE_PUBLISH}"
          python3 scratch/generate_daily_blogs.py

      - name: Publish queued drafts (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && (github.event.inputs.mode == 'publish' || github.event.inputs.mode == 'both') }}
        env:
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ACCESS_TOKEN }}
          SHOPIFY_SHOP_URL: https://the-pickle-affair.myshopify.com
          SHOPIFY_BLOG_ID: '96853164183'
          DAILY_BLOG_COUNT: ${{ github.event.inputs.count || '3' }}
        run: python3 scratch/daily_publish_daemon.py
